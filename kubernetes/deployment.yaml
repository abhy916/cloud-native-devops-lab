apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
        - name: devops-app
          image: 439126042992.dkr.ecr.us-east-1.amazonaws.com/cloud-native-devops-app:8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
